info:
  name: "[KCPM-9] TC_NOTI_03 - Đếm số lượng thông báo chưa đọc"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/notifications/unread-count?userId={{adminId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Đếm thông báo chưa đọc - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });
        expect(typeof res.getBody().data).to.equal("number");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
