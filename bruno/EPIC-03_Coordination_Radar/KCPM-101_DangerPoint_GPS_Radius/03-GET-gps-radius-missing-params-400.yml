info:
  name: "[KCPM-101] TC_DP_101_03 - Truyền thiếu tham số tọa độ/bán kính (400)"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/danger-points?lat=16.061&radius=500"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Chặn khi truyền thiếu kinh/vĩ độ hoặc bán kính - HTTP 400", function () {
            expect(res.getStatus()).to.equal(400);
            expect(res.getBody().success).to.be.false;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
