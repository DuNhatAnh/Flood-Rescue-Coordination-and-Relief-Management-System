info:
  name: "[KCPM-101] TC_DP_101_04 - BVA Tọa độ GPS ngoài khoảng hợp lệ (400)"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/danger-points?lat=95.0&lng=108.223&radius=500"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Chặn vĩ độ ngoài khoảng [-90, 90] - HTTP 400", function () {
            expect(res.getStatus()).to.equal(400);
            expect(res.getBody().success).to.be.false;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
