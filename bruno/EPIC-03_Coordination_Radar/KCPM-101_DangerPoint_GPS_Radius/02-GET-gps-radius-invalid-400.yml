info:
  name: "[KCPM-101] TC_DP_101_02 - BVA Bán kính quét <= 0 trả lỗi (400)"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/danger-points?lat=16.061&lng=108.223&radius=-50"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Chặn bán kính quét <= 0 - HTTP 400", function () {
            expect(res.getStatus()).to.equal(400);
            expect(res.getBody().success).to.be.false;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
