info:
  name: "[KCPM-101] TC_DP_101_12 - BVA lng Min = -180 (200)"
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/v1/danger-points?lat=16.05&lng=-180&radius=5000"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("BVA lng Min = -180 -> HTTP 200, trả về danh sách", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().data).to.be.an('array');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
