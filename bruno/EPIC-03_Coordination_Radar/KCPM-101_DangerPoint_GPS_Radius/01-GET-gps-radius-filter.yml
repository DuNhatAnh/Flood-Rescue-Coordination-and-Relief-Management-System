info:
  name: "[KCPM-101] TC_DP_101_01 - Lọc điểm nguy hiểm theo bán kính GPS hợp lệ (200)"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/danger-points?lat=16.061&lng=108.223&radius=500"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Lọc theo bán kính GPS thành công - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            const body = res.getBody();
            expect(body.success).to.be.true;
            expect(body.data).to.be.an('array');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
