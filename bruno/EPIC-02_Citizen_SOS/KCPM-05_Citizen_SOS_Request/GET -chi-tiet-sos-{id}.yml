info:
  name: "[KCPM-5] TC_REQ_03 - Xem chi tiết đơn SOS theo ID"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/rescue-requests/:id"
  params:
    - name: id
      value: "{{rescueRequestId}}"
      type: path
      description: ID of id
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
