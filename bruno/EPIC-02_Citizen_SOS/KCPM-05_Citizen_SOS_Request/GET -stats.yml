info:
  name: "[KCPM-5] TC_REQ_05 - Thống kê trạng thái yêu cầu SOS"
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/rescue-requests/stats"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
