info:
  name: "[KCPM-107] TC_SYS_03 - Xem danh sách cấu hình hệ thống"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/system/config"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("[KCPM-107] TC_SYS_03: Kiểm tra HTTP Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("[KCPM-107] TC_SYS_03: Kiểm tra cấu trúc danh sách cấu hình", function () {
            const body = res.getBody();
            expect(body.success).to.equal(true);
            expect(body.code).to.equal(200);
            expect(Array.isArray(body.data)).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
