info:
  name: "[KCPM-107] TC_SYS_08 - Xem báo cáo phân tích"
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/system/analytics"
  headers:
    - name: Authorization
      value: Bearer {{bearerToken}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("[KCPM-107] TC_SYS_08: Kiểm tra HTTP Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("[KCPM-107] TC_SYS_08: Kiểm tra cấu trúc Analytics KPIs", function () {
            const body = res.getBody();
            expect(body.success).to.equal(true);
            expect(body.code).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
