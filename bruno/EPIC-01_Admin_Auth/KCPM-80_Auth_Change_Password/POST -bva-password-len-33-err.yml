info:
  name: "[KCPM-80] BVA 6n+1 - Biên Max+1: mật khẩu mới 33 ký tự (400)"
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/change-password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{bearerToken}}
  body:
    type: json
    data: |-
      {
        "oldPassword": "admin123",
        "newPassword": "Pw@xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("BVA Max+1: mật khẩu 33 ký tự vượt tối đa 32 -> HTTP 400", function () {
            expect(res.getStatus()).to.equal(400);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
