info:
  name: "[KCPM-80] TC_AUTH_15 - BVA Biên Max: mật khẩu mới 32 ký tự (200)"
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/change-password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{bearerToken}}
  body:
    type: json
    data: |-
      {
        "oldPassword": "admin123",
        "newPassword": "Pw@xxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("BVA Max: mật khẩu 32 ký tự hợp lệ -> HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        // Teardown: trả mật khẩu admin về admin123 để các ca sau vẫn chạy được
        if (res.getStatus() === 200) {
            const axios = require("axios");
            await axios.post(bru.interpolate("{{baseUrl}}") + "/api/v1/auth/change-password",
                { oldPassword: "Pw@xxxxxxxxxxxxxxxxxxxxxxxxxxxxx", newPassword: "admin123" },
                { headers: { Authorization: "Bearer " + bru.interpolate("{{bearerToken}}") } });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
