info:
  name: "[KCPM-4] TC_USER_06 - Đổi vai trò sang COORDINATOR"
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/admin/users/{{testUserId}}/role?roleId=COORDINATOR"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("[KCPM-4] TC_USER_06: Đổi vai trò - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });
        expect(res.getBody().data.roleId).to.equal("COORDINATOR");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
