info:
  name: "[KCPM-4] TC_USER_04 - Xem chi tiết tài khoản vừa tạo"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/users/{{testUserId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("[KCPM-4] TC_USER_04: Xem chi tiết - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });
        expect(res.getBody().data.email).to.equal(bru.getVar("testUserEmail"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
