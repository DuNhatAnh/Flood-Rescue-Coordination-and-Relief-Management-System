info:
  name: "[KCPM-4] TC_USER_02 - Admin tạo tài khoản mới (mặc định ACTIVE)"
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/users"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fullName": "Nhân viên Bruno Test",
        "email": "{{testUserEmail}}",
        "phone": "0987654321",
        "roleId": "USER"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("testUserEmail", "user_bruno_" + Date.now() + "@rescue.vn");
    - type: after-response
      code: |-
        test("[KCPM-4] TC_USER_02: Tạo tài khoản - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });
        expect(res.getBody().data.status).to.equal("ACTIVE");
        bru.setVar("testUserId", res.getBody().data.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
