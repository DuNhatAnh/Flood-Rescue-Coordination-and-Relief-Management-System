info:
  name: "[KCPM-4] TC_USER_05 - Cập nhật họ tên & số điện thoại"
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/admin/users/{{testUserId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fullName": "Nhân viên Bruno Đã Cập Nhật",
        "phone": "0912345678",
        "roleId": "USER"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("[KCPM-4] TC_USER_05: Cập nhật thông tin - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });
        expect(res.getBody().data.fullName).to.equal("Nhân viên Bruno Đã Cập Nhật");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
