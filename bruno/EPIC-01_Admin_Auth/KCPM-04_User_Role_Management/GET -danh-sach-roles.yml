info:
  name: "[KCPM-4] TC_ROLE_01 - Xem danh sách vai trò"
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/roles"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("[KCPM-4] TC_ROLE_01: Lấy danh sách thành công - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });
        test("[KCPM-4] TC_ROLE_01: Có đủ 4 vai trò mặc định", function () {
            const names = res.getBody().data.map(r => r.name);
            expect(names).to.include.members(["ADMIN", "COORDINATOR", "RESCUE_STAFF", "USER"]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
