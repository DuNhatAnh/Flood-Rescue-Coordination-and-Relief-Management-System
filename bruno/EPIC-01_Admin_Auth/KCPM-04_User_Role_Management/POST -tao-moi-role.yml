info:
  name: "[KCPM-4] TC_ROLE_04 - Tạo vai trò mới"
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/roles"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "{{roleTestName}}",
        "description": "Vai trò tạm cho kiểm thử tự động",
        "permissions": ["REPORT"]
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("roleTestName", "qa_role_" + Date.now());
    - type: after-response
      code: |-
        test("[KCPM-4] TC_ROLE_04: Tạo thành công - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });
        test("[KCPM-4] TC_ROLE_04: Tên được lưu IN HOA", function () {
            expect(res.getBody().data.name).to.equal(bru.getVar("roleTestName").toUpperCase());
        });
        if (res.getBody().data && res.getBody().data.id) {
            bru.setVar("createdRoleId", res.getBody().data.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
