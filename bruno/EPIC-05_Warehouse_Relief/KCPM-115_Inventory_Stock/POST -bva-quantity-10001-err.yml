info:
  name: "[KCPM-115] TC_INV_09 - BVA Số lượng nhập Max+1: 10001 (400)"
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/v1/inventory/import?userId=admin-01"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "warehouseId": "{{bvaWarehouseId}}",
        "itemId": "{{bvaItemId}}",
        "quantity": 10001,
        "source": "Kiểm thử BVA",
        "referenceNumber": "PNK-BVA-10001",
        "condition": "NEW"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Lấy ID kho và vật tư có thật trong DB (ID thay đổi mỗi lần seed lại dữ liệu)
        const axios = require("axios");
        const base = bru.interpolate("{{baseUrl}}");
        const auth = { headers: { Authorization: "Bearer " + bru.interpolate("{{bearerToken}}") } };
        const wh = await axios.get(base + "/api/v1/warehouses", auth);
        const it = await axios.get(base + "/api/v1/relief-items", auth);
        bru.setVar("bvaWarehouseId", wh.data.data[0].id);
        bru.setVar("bvaItemId", it.data.data[0].id);
    - type: after-response
      code: |-
        test("BVA số lượng Max+1 = 10001 -> HTTP 400 Bad Request", function () {
            expect(res.getStatus()).to.equal(400);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
