info:
  name: "[KCPM-115] TC_INV_01 - Lập phiếu nhập kho nhu yếu phẩm (/import)"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/inventory/import?userId=admin-01"
  params:
    - name: userId
      value: "admin-01"
      type: query
      description: ID of user performing import
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "warehouseId": "{{bvaWarehouseId}}",
        "itemId": "{{bvaItemId}}",
        "quantity": 100,
        "source": "Ủy ban Mặt trận Tổ quốc",
        "referenceNumber": "PNK-2026-001",
        "condition": "NEW"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Lấy ID kho và vật tư có thật trong DB (ID thay đổi mỗi lần seed lại dữ liệu)
        const axios = require("axios");
        const base = bru.interpolate("{{baseUrl}}");
        const auth = { headers: { Authorization: "Bearer " + bru.interpolate("{{bearerToken}}") } };
        const wh = await axios.get(base + "/api/v1/warehouses", auth);
        const it = await axios.get(base + "/api/v1/relief-items", auth);
        bru.setVar("bvaWarehouseId", wh.data.data[0].id);
        bru.setVar("bvaItemId", it.data.data[0].id);
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
