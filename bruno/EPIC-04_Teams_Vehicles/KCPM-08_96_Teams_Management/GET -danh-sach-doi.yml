info:
  name: "[KCPM-08] TC_TEAM_01 - Lấy danh sách các đội cứu nạn"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/teams"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Lấy danh sách đội - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });
        const team = res.getBody().data[0];
        bru.setVar("teamId", team.id);
        bru.setVar("teamName", team.teamName);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
