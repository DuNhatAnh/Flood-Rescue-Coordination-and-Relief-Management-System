info:
  name: "[KCPM-97] TC_VEH_05 - Cập nhật thông tin phương tiện"
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/vehicles/:id?userId={{adminId}}"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "{{createdVehicleId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "vehicleType": "CANO",
        "licensePlate": "{{vehPlate}}",
        "currentLocation": "Ben Cua Dai"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Cập nhật xe - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });
        expect(res.getBody().data.currentLocation).to.equal("Ben Cua Dai");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
