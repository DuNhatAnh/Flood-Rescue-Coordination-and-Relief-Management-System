info:
  name: "[KCPM-08] TC_VEH_04 - Xem thống kê tổng hợp phương tiện"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/vehicles/statistics-summary"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
