info:
  name: "[KCPM-113] TC_VEH_13 - BVA Sức chứa Max+1: 21 người (400)"
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/api/v1/vehicles?userId=6ac8a492b3505b0db326b89e"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "vehicleType": "CANO",
        "licensePlate": "{{vehPlate}}",
        "currentLocation": "Ben song Thu Bon",
        "capacity": 21
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("vehPlate", "BVA-C21-" + Date.now().toString().slice(-8));
    - type: after-response
      code: |-
        test("BVA sức chứa Max+1 = 21 -> HTTP 400 Bad Request", function () {
            expect(res.getStatus()).to.equal(400);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
