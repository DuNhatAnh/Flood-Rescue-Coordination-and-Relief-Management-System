info:
  name: "[KCPM-114] TC_DISPATCH_01 - Lệnh xuất kích phối hợp gán Đội và Phương tiện"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/assignments/dispatch"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "requestId": "{{dispatchReqId}}",
        "vehicleIds": ["{{dispatchVehicleId}}"]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Điều phối xe cho đơn SOS - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().assignmentId !== undefined).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
