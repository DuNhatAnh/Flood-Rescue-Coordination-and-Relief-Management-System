info:
  name: POST /import
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/inventory/import?userId=admin-01"
  params:
    - name: userId
      value: "admin-01"
      type: query
      description: ID of user performing import
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "warehouseId": "6ac5fed5346e4a02fdcf9644",
        "itemId": "6ac5fed5346e4a02fdcf9647",
        "quantity": 100,
        "source": "Ủy ban Mặt trận Tổ quốc",
        "referenceNumber": "PNK-2026-001",
        "condition": "NEW"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
