info:
  name: TC_BVA_02 - Biên Dưới Hợp Lệ Min (Quantity = 1)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/inventory/import?userId=admin-01"
  params:
    - name: userId
      value: "admin-01"
      type: query
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "warehouseId": "6ac5fed5346e4a02fdcf9644",
        "itemId": "6ac5fed5346e4a02fdcf9647",
        "quantity": 1,
        "source": "Ủy ban Mặt trận Tổ quốc",
        "referenceNumber": "BVA-IMP-002",
        "condition": "NEW"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("[BVA-02] Chấp nhận số lượng tối thiểu 1 (Kỳ vọng 200/201)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
