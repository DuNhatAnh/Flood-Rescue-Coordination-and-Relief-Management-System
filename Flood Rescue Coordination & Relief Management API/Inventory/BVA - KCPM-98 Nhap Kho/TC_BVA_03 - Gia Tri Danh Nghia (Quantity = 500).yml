  body:
    type: json
    data: |-
      {
        "warehouseId": "6ac5fed5346e4a02fdcf9644",
        "itemId": "6ac5fed5346e4a02fdcf9647",
        "quantity": 500,
        "source": "Hội Chữ Thập Đỏ Việt Nam",
        "referenceNumber": "BVA-IMP-003",
        "condition": "NEW"
