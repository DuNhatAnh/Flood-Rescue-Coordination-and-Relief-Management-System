info:
  name: TC_SYS_04 - [PUT] /api/v1/admin/system/config (Cập nhật cấu hình hệ thống hợp lệ)
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/admin/system/config?key=ALERT&value=ON&adminId=admin-01"
  params:
    - name: key
      value: ALERT
      type: query
    - name: value
      value: ON
      type: query
    - name: adminId
      value: admin-01
      type: query
  headers:
    - name: Authorization
      value: Bearer {{bearerToken}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("TC_SYS_04: Cập nhật cấu hình thành công - HTTP Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("TC_SYS_04: Kiểm tra dữ liệu cấu hình cập nhật", function () {
            const body = res.getBody();
            expect(body.success).to.equal(true);
            expect(body.code).to.equal(200);
            expect(body.data.key).to.equal("ALERT");
            expect(body.data.value).to.equal("ON");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
