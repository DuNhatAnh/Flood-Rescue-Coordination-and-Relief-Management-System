info:
  name: TC_SYS_01 - [GET] /api/v1/admin/system/logs (Xem nhật ký thao tác hệ thống)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/system/logs"
  headers:
    - name: Authorization
      value: Bearer {{bearerToken}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("TC_SYS_01: Kiểm tra HTTP Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("TC_SYS_01: Kiểm tra cấu trúc ApiResponse", function () {
            const body = res.getBody();
            expect(body.success).to.equal(true);
            expect(body.code).to.equal(200);
            expect(Array.isArray(body.data)).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
