info:
  name: "[KCPM-4] TC_ROLE_02 - Xem chi tiết vai trò ADMIN"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/roles/ADMIN"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("[KCPM-4] TC_ROLE_02: Lấy chi tiết thành công - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });
        test("[KCPM-4] TC_ROLE_02: Đúng vai trò ADMIN", function () {
            expect(res.getBody().data.name).to.equal("ADMIN");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
