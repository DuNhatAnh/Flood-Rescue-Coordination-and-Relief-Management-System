info:
  name: "[KCPM-4] TC_ROLE_07 - Cập nhật mô tả vai trò vừa tạo"
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/admin/roles/{{createdRoleId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "description": "Đã cập nhật bởi Bruno",
        "permissions": ["REPORT", "COORDINATE"]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("[KCPM-4] TC_ROLE_07: Cập nhật thành công - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });
        test("[KCPM-4] TC_ROLE_07: Mô tả và quyền đã đổi", function () {
            const d = res.getBody().data;
            expect(d.description).to.equal("Đã cập nhật bởi Bruno");
            expect(d.permissions).to.include("COORDINATE");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
