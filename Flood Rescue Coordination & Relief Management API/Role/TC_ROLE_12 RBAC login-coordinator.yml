info:
  name: "[KCPM-60] TC_ROLE_12 - RBAC - Đăng nhập Coordinator lấy token"
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "coordinator@rescue.vn",
        "password": "admin123"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        test("[KCPM-60] TC_ROLE_12: Coordinator đăng nhập thành công - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().token).to.be.a("string");
        });
        bru.setVar("coordinatorToken", res.getBody().token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
