info:
  name: "[KCPM-100] Chuẩn bị 2 - Khóa tài khoản test (INACTIVE)"
  type: http
  seq: 9

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/admin/users/{{inactiveUserId}}/status?status=INACTIVE"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Khóa tài khoản - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });
        expect(res.getBody().data.status).to.equal("INACTIVE");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
