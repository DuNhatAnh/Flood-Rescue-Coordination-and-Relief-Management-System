info:
  name: TC_AUTH_10 - POST /api/v1/auth/change-password (Mật khẩu quá ngắn)
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/change-password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{bearerToken}}
  body:
    type: json
    data: |-
      {
        "oldPassword": "admin123",
        "newPassword": "123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("TC_AUTH_10: Bắt lỗi mật khẩu quá ngắn - Status code is 400 Bad Request", function () {
            expect(res.getStatus()).to.equal(400);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
