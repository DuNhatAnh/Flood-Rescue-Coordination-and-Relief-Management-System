info:
  name: "[KCPM-100] Chuẩn bị 1 - Admin tạo tài khoản test"
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/users"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fullName": "Tài khoản bị khóa KCPM-100",
        "email": "{{inactiveEmail}}",
        "phone": "0912345678",
        "roleId": "USER"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("inactiveEmail", "inactive_" + Date.now() + "@rescue.vn");
    - type: after-response
      code: |-
        test("Tạo tài khoản test - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });
        bru.setVar("inactiveUserId", res.getBody().data.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
