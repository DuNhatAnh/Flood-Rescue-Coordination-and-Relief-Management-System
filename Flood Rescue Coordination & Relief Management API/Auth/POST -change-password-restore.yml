info:
  name: "[KCPM-80] TC_AUTH_08b - Khôi phục mật khẩu admin123"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/change-password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{bearerToken}}
  body:
    type: json
    data: |-
      {
        "oldPassword": "adminPassword@2026",
        "newPassword": "admin123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Teardown cho TC_AUTH_08: trả mật khẩu admin về admin123 để các test sau (và lần chạy sau) đăng nhập được
        test("[KCPM-80] TC_AUTH_08b: Khôi phục mật khẩu admin - Status code is 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
