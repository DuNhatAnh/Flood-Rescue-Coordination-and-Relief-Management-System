info:
  name: TC_AUTH_11 - POST /api/v1/auth/change-password (Trùng mật khẩu cũ)
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/change-password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{bearerToken}}
  body:
    type: json
    data: |-
      {
        "oldPassword": "admin123",
        "newPassword": "admin123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("TC_AUTH_11: Bắt lỗi trùng mật khẩu cũ - Status code is 400 Bad Request", function () {
            expect(res.getStatus()).to.equal(400);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
