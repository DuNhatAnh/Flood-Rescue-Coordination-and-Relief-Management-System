info:
  name: TC_AUTH_08 - POST /api/v1/auth/change-password (Thành công)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/change-password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{bearerToken}}
  body:
    type: json
    data: |-
      {
        "oldPassword": "admin123",
        "newPassword": "adminPassword@2026"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("TC_AUTH_08: Đổi mật khẩu thành công - Status code is 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
