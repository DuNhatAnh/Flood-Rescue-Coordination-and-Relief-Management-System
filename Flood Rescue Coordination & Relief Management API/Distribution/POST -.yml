info:
  name: POST /
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/distributions"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "warehouseId": "6ac5fed5346e4a02fdcf9644",
        "requestId": "rescue-req-01",
        "type": "TRANSFER",
        "destinationWarehouseId": "6ac5fed5346e4a02fdcf9645",
        "items": [
          {
            "itemId": "6ac5fed5346e4a02fdcf9647",
            "quantity": 10
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
            if (res.getBody() && res.getBody().id) {
                bru.setVar("distributionId", res.getBody().id);
            }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
