info:
  name: "GET /{id}"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/teams/:id"
  params:
    - name: id
      value: "{{teamId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Xem chi tiết đội - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });
        expect(res.getBody().data.id).to.equal(bru.getVar("teamId"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
