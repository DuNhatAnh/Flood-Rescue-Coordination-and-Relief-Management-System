info:
  name: "PUT /{id}"
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/teams/:id"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "{{teamId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "teamName": "{{teamName}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Cập nhật tên đội (giữ nguyên tên cũ để không đổi dữ liệu mẫu) - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
