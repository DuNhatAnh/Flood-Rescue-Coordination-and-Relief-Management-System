info:
  name: PUT /{id}
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/relief-items/:id"
  params:
    - name: id
      value: "{{itemId}}"
      type: path
      description: ID of id
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "itemName": "Mì tôm Hảo Hảo (Cập nhật)",
        "unit": "Thùng",
        "description": "Thùng 30 gói mì tôm chua cay",
        "imageUrl": "https://example.com/mi-tom-update.jpg"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
