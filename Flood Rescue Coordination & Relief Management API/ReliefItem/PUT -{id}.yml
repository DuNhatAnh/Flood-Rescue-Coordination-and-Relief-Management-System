info:
  name: PUT /{id}
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/relief-items/:id"
  params:
    - name: id
      value: "1"
      type: path
      description: ID of id
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
