info:
  name: "Chuẩn bị 4 - Tạo xe thay thế"
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/vehicles?userId={{adminId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "vehicleType": "CANO",
        "licensePlate": "{{assignPlate2}}",
        "currentLocation": "Bến Lệ Thủy"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("assignPlate2", "BR-B" + Date.now().toString().slice(-8));
    - type: after-response
      code: |-
        test("Tạo xe thay thế - HTTP 201", function () {
            expect(res.getStatus()).to.equal(201);
            expect(res.getBody().success).to.equal(true);
        });
        bru.setVar("assignVehicleId2", res.getBody().data.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
