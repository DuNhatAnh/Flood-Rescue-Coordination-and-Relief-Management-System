info:
  name: POST /
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/assignments"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "requestId": "6ae9f0a87c11de07e162668a",
        "teamId": "6ac3beab5219eb487c8bfc30",
        "vehicleIds": ["6ac3beab5219eb487c8bfc33"],
        "assignedBy": "admin@rescue.vn",
        "note": "Dieu dong ho tro khan cap",
        "missionItems": [
          {
            "itemId": "6ac3beab5219eb487c8bfc1a",
            "itemName": "Gao",
            "quantity": 50,
            "unit": "kg"
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
