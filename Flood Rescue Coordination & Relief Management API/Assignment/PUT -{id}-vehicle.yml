info:
  name: "PUT /{id}/vehicle"
  type: http
  seq: 9

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/assignments/:id/vehicle"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "{{assignmentId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "newVehicleIds": ["{{assignVehicleId2}}"],
        "reason": "Xe thay the do hu hong"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Đổi xe cho nhiệm vụ - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
