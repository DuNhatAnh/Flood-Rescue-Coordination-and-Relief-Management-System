info:
  name: DELETE /{id}
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/danger-points/{{dangerPointId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
