info:
  name: "GET /pending"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/rescue-requests/pending"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Lấy đơn chờ xử lý - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });
        expect(res.getBody().data.length > 0).to.be.true;
        bru.setVar("coordReqId", res.getBody().data[0].id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
