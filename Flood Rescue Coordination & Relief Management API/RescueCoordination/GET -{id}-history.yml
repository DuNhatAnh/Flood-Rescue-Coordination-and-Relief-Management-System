info:
  name: "GET /{id}/history"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/rescue-requests/:id/history"
  params:
    - name: id
      value: "{{coordReqId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Xem lịch sử trạng thái - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });
        expect(Array.isArray(res.getBody().data)).to.be.true;

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
