info:
  name: PUT /{id}/urgency
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/rescue-requests/:id/urgency"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "1"
      type: path
      description: ID of id
  body:
    type: json
    data: |-
      {
        "name": "Mẫu dữ liệu",
        "description": "Mô tả chi tiết",
        "status": "ACTIVE"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
