info:
  name: "PUT /{id}/urgency"
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/rescue-requests/:id/urgency"
  headers:
    - name: Content-Type
      value: text/plain
  params:
    - name: id
      value: "{{coordReqId}}"
      type: path
  body:
    type: json
    data: |-
      CRITICAL
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Gán mức độ khẩn cấp - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
