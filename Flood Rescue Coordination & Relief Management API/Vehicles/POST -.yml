info:
  name: POST /
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/vehicles?userId=6ac8a492b3505b0db326b89e"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: userId
      value: "6ac8a492b3505b0db326b89e"
      type: query
  body:
    type: json
    data: |-
      {
        "vehicleType": "CANO",
        "licensePlate": "43A-888.99",
        "currentLocation": "Ben song Thu Bon",
        "teamId": "6ac8a49ab3505b0db326b8c1"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
        });

        try {
            var resData = res.getBody();
            if (resData && resData.data && resData.data.id) {
                bru.setCollectionVar("createdVehicleId", resData.data.id);
            }
        } catch (e) {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
