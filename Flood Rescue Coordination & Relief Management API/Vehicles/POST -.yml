info:
  name: "POST /"
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/vehicles?userId={{adminId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "vehicleType": "CANO",
        "licensePlate": "{{vehPlate}}",
        "currentLocation": "Ben song Thu Bon"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("vehPlate", "BR-V" + Date.now().toString().slice(-8));
    - type: after-response
      code: |-
        test("Tạo xe - HTTP 201", function () {
            expect(res.getStatus()).to.equal(201);
            expect(res.getBody().success).to.equal(true);
        });
        bru.setCollectionVar("createdVehicleId", res.getBody().data.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
