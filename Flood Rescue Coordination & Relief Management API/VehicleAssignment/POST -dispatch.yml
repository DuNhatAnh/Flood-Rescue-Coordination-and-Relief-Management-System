info:
  name: POST /dispatch
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/assignments/dispatch"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "requestId": "6ac8a496b3505b0db326b8a3",
        "teamId": "6ac8a49ab3505b0db326b8c2",
        "vehicleIds": ["6ac8a49bb3505b0db326b8c7"]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
