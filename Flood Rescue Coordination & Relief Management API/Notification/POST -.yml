info:
  name: "POST /"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/notifications"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "userId": "{{adminId}}",
        "title": "Cảnh báo lũ khẩn cấp",
        "content": "Mực nước sông dâng cao, chuẩn bị sơ tán",
        "type": "WARNING"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Gửi thông báo hợp lệ - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().success).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
