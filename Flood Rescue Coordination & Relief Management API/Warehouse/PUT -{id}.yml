info:
  name: PUT /{id}
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/warehouses/:id"
  params:
    - name: id
      value: "{{warehouseId}}"
      type: path
      description: ID of id
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "warehouseName": "Kho Cứu Trợ Đà Nẵng (Đã cập nhật)",
        "location": "Quận Cẩm Lệ, TP. Đà Nẵng",
        "managerId": "manager-01",
        "status": "ACTIVE",
        "latitude": 16.0544,
        "longitude": 108.2022
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
