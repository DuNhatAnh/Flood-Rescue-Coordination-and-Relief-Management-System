info:
  name: POST /
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/warehouses"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "warehouseName": "Kho Cứu Trợ Trung Tâm Đà Nẵng",
        "location": "Huyện Hòa Vang, TP. Đà Nẵng",
        "managerId": "manager-01",
        "status": "ACTIVE",
        "latitude": 16.0544,
        "longitude": 108.2022
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
            if (res.getBody() && res.getBody().data && res.getBody().data.id) {
                bru.setVar("warehouseId", res.getBody().data.id);
            }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
