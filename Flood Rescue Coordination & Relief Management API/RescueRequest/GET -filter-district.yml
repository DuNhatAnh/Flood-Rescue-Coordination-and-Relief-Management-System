info:
  name: GET / (Filter District)
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/v1/rescue-requests?district=Hải Châu"
  params:
    - name: district
      value: Hải Châu
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Lọc danh sách theo quận/huyện thành công - HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
            const body = res.getBody();
            expect(body.success).to.be.true;
            expect(Array.isArray(body.data)).to.be.true;
            body.data.forEach(item => {
                expect(item.addressText.toLowerCase()).to.include("hải châu");
            });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
