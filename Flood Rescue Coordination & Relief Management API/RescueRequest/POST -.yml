info:
  name: POST /
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/rescue-requests"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "citizenName": "Nguyễn Văn A",
        "citizenPhone": "0987654321",
        "addressText": "Số 123 Đường Lũ Lụt, Xã Đại Lộc",
        "locationLat": 15.88,
        "locationLng": 108.05,
        "numberOfPeople": 4,
        "urgencyLevel": "HIGH",
        "description": "Cần cano cứu trợ khẩn cấp, nước dâng ngập mái"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
