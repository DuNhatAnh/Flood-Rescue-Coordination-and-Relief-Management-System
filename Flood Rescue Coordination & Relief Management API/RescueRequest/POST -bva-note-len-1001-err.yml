info:
  name: "BVA TC28 - POST / (Biên lỗi Note vượt Max: 1001 ký tự - 400)"
  type: http
  seq: 28

http:
  method: POST
  url: "{{baseUrl}}/api/v1/rescue-requests"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "citizenName": "Chu Văn DD",
        "citizenPhone": "0987654348",
        "addressText": "Thôn An Tây, Đại Lộc",
        "locationLat": 16.0544,
        "locationLng": 108.2022,
        "numberOfPeople": 4,
        "urgencyLevel": "MEDIUM",
        "description": "CuuTroKhanCap_"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Chặn mô tả vượt quá độ dài tối đa (1001 ký tự) -> HTTP 400 Bad Request", function () {
            expect(res.getStatus()).to.equal(400);
            const body = res.getBody();
            if (body) {
                expect(body.success).to.be.false;
            }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
