info:
  name: PATCH /{id}/status (Chuyển sang COMPLETED)
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/rescue-requests/{{rescueRequestId}}/status"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "COMPLETED",
        "note": "Đã hoàn thành cứu hộ an toàn"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Cập nhật trạng thái sang COMPLETED thành công - HTTP 200", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
            if (res.getBody() && res.getBody().data) {
                const id = res.getBody().data.requestId || res.getBody().data.id;
                bru.setVar("completedRequestId", id);
            }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
