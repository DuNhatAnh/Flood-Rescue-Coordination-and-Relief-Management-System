info:
  name: "BVA TC01 - POST / (Biên lỗi số âm: -1 người - 400 Bad Request)"
  type: http
  seq: 20

http:
  method: POST
  url: "{{baseUrl}}/api/v1/rescue-requests"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "citizenName": "Nguyễn Văn A",
        "citizenPhone": "0987654321",
        "addressText": "Xã Đại Cường",
        "locationLat": 16.0544,
        "locationLng": 108.2022,
        "numberOfPeople": -1,
        "urgencyLevel": "HIGH",
        "description": "Nước ngập đến nóc nhà"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Chặn lỗi số người âm (-1) -> HTTP 400 Bad Request", function () {
            expect(res.getStatus()).to.equal(400);
            const body = res.getBody();
            if (body) {
                expect(body.success).to.be.false;
            }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
