info:
  name: POST /
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/users"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fullName": "Nhân viên Admin Test",
        "email": "{{adminTestEmail}}",
        "phone": "0987654321",
        "roleId": "ADMIN",
        "status": "ACTIVE"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        var randomNum = Math.floor(Math.random() * 100000);
        bru.setVar("adminTestEmail", "admin_auto_" + Date.now() + "_" + randomNum + "@rescue.vn");
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
        });
        if (res.getBody().data && res.getBody().data.id) {
            bru.setEnvVar("adminUserId", res.getBody().data.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
