info:
  name: GET /{id}
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/users/:id"
  params:
    - name: id
      value: "{{adminUserId}}"
      type: path
      description: ID of id
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getEnvVar("adminUserId")) {
            bru.setEnvVar("adminUserId", "6ac5fed4346e4a02fdcf9639");
        }
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
