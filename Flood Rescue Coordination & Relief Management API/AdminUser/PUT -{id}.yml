info:
  name: PUT /{id}
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/admin/users/:id"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "{{adminUserId}}"
      type: path
      description: ID of id
  body:
    type: json
    data: |-
      {
        "fullName": "Quản trị viên Cập nhật",
        "phone": "0912345678",
        "roleId": "ADMIN"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getEnvVar("adminUserId")) {
            bru.setEnvVar("adminUserId", "6ac5fed4346e4a02fdcf9639");
        }
    - type: after-response
      code: |-
        test("Phản hồi thành công (200, 201, 204)", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201, 204]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
