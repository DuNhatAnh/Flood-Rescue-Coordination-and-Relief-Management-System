name: Flood Rescue CI/CD Pipeline & Build Versioning

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'test/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
      - develop
      - 'test/**'
  workflow_dispatch:

env:
  DOCKER_IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/flood-rescue-backend
  DOCKER_IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/flood-rescue-frontend

jobs:
  # =========================================================================
  # 1. STATIC CODE ANALYSIS (QODANA)
  # =========================================================================
  code-quality-qodana:
    name: 1. Qodana Code Quality Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Qodana Scan (Backend Java)
        uses: JetBrains/qodana-action@v2024.1
        continue-on-error: true
        with:
          args: --project-dir,backend
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Upload Qodana Scan Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qodana-report
          path: ${{ runner.temp }}/qodana/results

  # =========================================================================
  # 2. BACKEND BUILD & UNIT TEST
  # =========================================================================
  backend-build-test:
    name: 2. Build & Test Spring Boot Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven Build & Unit Test
        working-directory: ./backend
        run: |
          mvn clean test package -DskipTests=false

      - name: Upload Build Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  # =========================================================================
  # 3. AUTOMATED API TESTING (CODECEPTJS)
  # =========================================================================
  api-automation-test:
    name: 3. API Automation Testing (CodeceptJS)
    needs: [backend-build-test]
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Backend Jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./backend/target

      - name: Start Backend Service in Background
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/flood_rescue_test_db
        run: |
          JAR_FILE=$(ls backend/target/*.jar | head -n 1)
          echo "Starting application with $JAR_FILE"
          nohup java -jar $JAR_FILE > backend.log 2>&1 &
          
          echo "Waiting for Spring Boot to be healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/api/v1/teams > /dev/null; then
              echo "Backend service is UP and responding!"
              break
            fi
            echo "Waiting ($i/30)..."
            sleep 2
          done

      - name: Install CodeceptJS Dependencies
        working-directory: ./test-automation
        run: npm install

      - name: Run CodeceptJS API Test Suite (16 APIs)
        continue-on-error: true
        working-directory: ./test-automation
        run: |
          npm run test:report || npm run test:api

      - name: Upload CodeceptJS Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeceptjs-test-reports
          path: |
            test-automation/output
            backend.log

  # =========================================================================
  # 4. DOCKER BUILD & VERSION MANAGEMENT (DOCKER HUB PUSH)
  # =========================================================================
  docker-build-push:
    name: 4. Docker Build & Version Management (Docker Hub)
    needs: [code-quality-qodana, backend-build-test, api-automation-test]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Metadata & Version Tags for Backend ---
      - name: Extract Docker metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_BACKEND }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # --- Build & Push Backend Image ---
      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Metadata & Version Tags for Frontend ---
      - name: Extract Docker metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_FRONTEND }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # --- Build & Push Frontend Image ---
      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
