services:
  mongodb:
    image: mongo:latest
    container_name: rescue_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rescue_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/flood_rescue_db
    depends_on:
      - mongodb
    volumes:
      - ./uploads:/app/uploads
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rescue_frontend
    ports:
      - "8081:80"
    restart: always

volumes:
  mongo_data:

